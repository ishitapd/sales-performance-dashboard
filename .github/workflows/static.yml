name: Validate Project Structure

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify key files exist
        run: |
          echo "Checking project structure..."
          test -f README.md && echo "✅ README.md found"
          test -f docs/index.html && echo "✅ Dashboard (docs/index.html) found"
          test -f datasets/sample_data.csv && echo "✅ Dataset found"
          test -f python/01_data_cleaning.py && echo "✅ Python cleaning script found"
          test -f python/02_eda.py && echo "✅ Python EDA script found"
          test -f python/03_business_analysis.py && echo "✅ Python business analysis found"
          test -f sql/01_revenue_analysis.sql && echo "✅ SQL revenue analysis found"
          test -f sql/06_advanced_analysis.sql && echo "✅ SQL advanced analysis found"
          test -f powerbi/dax_measures.md && echo "✅ DAX measures catalog found"
          test -f powerbi/dashboard_guide.md && echo "✅ Power BI dashboard guide found"
          echo ""
          echo "All project files verified successfully."
